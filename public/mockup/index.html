<!doctype html>
<html lang="fr-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maquette — Au Fil de l’Eau · desktop &amp; mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Quicksand:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lin: #f3f1ec;
        --ardoise: #3d3a34;
        --mute: #6b655c;
        --chene: #c4b39a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--lin);
        color: var(--ardoise);
        font-family: Quicksand, sans-serif;
        overflow: hidden;
      }
      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 40px 72px;
      }
      .label {
        position: absolute;
        top: 36px;
        left: 0;
        right: 0;
        text-align: center;
      }
      .label p {
        margin: 0;
        letter-spacing: 0.28em;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--mute);
      }
      .label h1 {
        margin: 10px 0 0;
        font-family: Fraunces, serif;
        font-weight: 300;
        font-size: 28px;
        letter-spacing: 0.04em;
      }
      .devices {
        position: relative;
        width: min(1180px, 92vw);
        height: min(620px, 72vh);
        margin-top: 48px;
      }
      .laptop {
        position: absolute;
        left: 0;
        top: 8%;
        width: 78%;
      }
      .laptop-lid {
        background: #1a1a1a;
        border-radius: 14px 14px 0 0;
        padding: 12px 12px 0;
        box-shadow: 0 40px 80px rgba(40, 34, 24, 0.18);
      }
      .laptop-cam {
        display: block;
        width: 8px;
        height: 8px;
        margin: 0 auto 8px;
        border-radius: 50%;
        background: #2c2c2c;
      }
      .laptop-screen {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        object-position: top;
        background: #111;
      }
      .laptop-base {
        height: 18px;
        background: linear-gradient(#cfcbc4, #b7b2a8);
        border-radius: 0 0 10px 10px;
        position: relative;
      }
      .laptop-base::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 4px;
        width: 18%;
        height: 6px;
        transform: translateX(-50%);
        background: #9e998f;
        border-radius: 0 0 6px 6px;
      }
      .phone {
        position: absolute;
        right: 2%;
        top: 6%;
        width: 22%;
        background: #111;
        border-radius: 36px;
        padding: 12px 10px 16px;
        box-shadow: 0 30px 60px rgba(40, 34, 24, 0.28);
      }
      .phone-notch {
        width: 38%;
        height: 14px;
        margin: 0 auto 8px;
        background: #000;
        border-radius: 0 0 10px 10px;
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 8px;
      }
      .foot {
        position: absolute;
        bottom: 22px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="label">
        <p>LD Media · proposition</p>
        <h1>Au Fil de l’Eau</h1>
      </div>
      <div class="devices">
        <div class="laptop">
          <div class="laptop-lid">
            <span class="laptop-cam"></span>
            <img class="laptop-screen" src="desktop.jpg" alt="Site sur ordinateur" />
          </div>
          <div class="laptop-base"></div>
        </div>
        <div class="phone">
          <div class="phone-notch"></div>
          <img src="mobile.jpg" alt="Site sur mobile" />
        </div>
      </div>
      <p class="foot">Ordinateur · 1440 px &nbsp;·&nbsp; Mobile · barre Appeler / Itinéraire / Réserver</p>
    </div>
  </body>
</html>
